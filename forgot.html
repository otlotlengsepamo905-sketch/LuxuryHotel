<!-- Forgot Password Modal Overlay -->
<div id="forgot-password-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card">
        <button type="button" class="modal-close-btn" id="close-modal-trigger" aria-label="Close modal">&times;</button>
        <script src="forgot.js"></script>
        <div class="modal-header">
            <h3>Reset Password</h3>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <form id="forgot-password-form">
            <div class="form-group">
                <label for="reset-email">Email Address</label>
                <input type="email" id="reset-email" required placeholder="name@example.com">
            </div>
            
            <button type="submit" class="submit-btn">Send Reset Link</button>
        </form>

        <!-- Dynamic Success Message Container -->
        <div id="reset-success-message" class="success-message" style="display: none;">
            <p><strong>Success!</strong> A reset link has been sent to your email.</p>
        </div>
    </div>
</div>
